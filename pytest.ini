[pytest]
# Test của repo viết bằng unittest, không cần plugin pytest nào.
# Chặn 2 plugin hay làm pytest 6.2.5 (bản apt của Ubuntu 22.04) chết ngay khi khởi động:
#   * anyio  – pip kéo bản mới về ~/.local khi cài faster-whisper / mediapipe ...; plugin của nó cần pytest >= 7
#              -> "ModuleNotFoundError: No module named '_pytest.scope'"
#   * launch_testing + launch_ros – plugin của ROS (chỉ dùng cho launch test), lỗi với một số bản pytest.
#     Phải chặn CẢ HAI: chặn riêng launch_testing thì launch_ros (cần hook của nó) báo "unknown hook".
# Chặn plugin không cài trên máy thì vô hại.
addopts = -p no:anyio -p no:launch_testing -p no:launch_ros -p no:cacheprovider
testpaths = test
